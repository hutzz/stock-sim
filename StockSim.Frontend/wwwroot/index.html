<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>Stock Sim</title>
		<base href="/" />
		<!-- <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" /> -->
		<link href="css/app.css" rel="stylesheet" />
		<link href="StockSim.Frontend.styles.css" rel="stylesheet" />
		<link href="css/tailwind.css" rel="stylesheet" />
		<link href="css/main.css" rel="stylesheet" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
	</head>

	<body>
		<div id="app">
			<!-- Shown while the WebAssembly bundle downloads and boots; replaced on first render. -->
			<div class="app-splash" id="app-splash">
				<span class="splash-mark"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></span>
				<span class="splash-name">Stock Sim</span>
				<span class="loading-spinner" role="progressbar" aria-label="Loading Stock Sim"></span>
			</div>
		</div>
		<script>
			// The dashboard renders its own "Loading your portfolio" placeholder once it is up, so a
			// hard load of it would show the boot splash and that placeholder back to back. Dropping
			// the splash here (before first paint) leaves the single portfolio loader. Every other
			// page keeps the splash, and in-app navigation never sees it because Blazor has already
			// replaced this markup by then.
			(function () {
				var path = window.location.pathname.replace(/\/+$/, "").toLowerCase();
				if (path === "/dashboard" || path.indexOf("/dashboard/") === 0) {
					var splash = document.getElementById("app-splash");
					if (splash) {
						splash.remove();
					}
				}
			})();
		</script>

		<div id="blazor-error-ui">
			An unhandled error has occurred.
			<a href="" class="reload">Reload</a>
			<a class="dismiss">🗙</a>
		</div>
		<script src="_framework/blazor.webassembly.js"></script>
		<script src="charts/chart.min.js"></script>
		<script src="charts/chartTheme.js"></script>
		<script src="charts/lineGraph.js"></script>
		<script src="charts/radarChart.js"></script>
		<script src="charts/stockPie.js"></script>
		<script src="charts/trendChart.js"></script>
	</body>
</html>
